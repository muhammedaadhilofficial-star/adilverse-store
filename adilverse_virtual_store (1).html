<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADILVERSE — Virtual Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@500;700&display=swap');
:root{--bg:#080a12;--glass:rgba(15,20,34,.72);--line:rgba(170,195,255,.18);--cyan:#68e8ff;--violet:#9b74ff;--text:#f5f7ff;--muted:#9ba7c5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#222a43,#080a12 70%)}canvas{display:block}
.top{position:fixed;z-index:5;top:18px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{pointer-events:auto;font-family:Orbitron,sans-serif;letter-spacing:.16em;font-weight:700;font-size:20px;text-shadow:0 0 18px #68e8ff55}.brand small{display:block;font:10px Space Grotesk;letter-spacing:.25em;color:var(--muted);margin-top:4px}.topright{display:flex;gap:10px;pointer-events:auto}.glassbtn,.chip{border:1px solid var(--line);background:rgba(13,18,31,.62);backdrop-filter:blur(18px);color:#fff;border-radius:999px;padding:10px 15px;font:inherit;cursor:pointer}.glassbtn:hover,.chip:hover{border-color:#68e8ff88;box-shadow:0 0 20px #68e8ff22}.hud{position:fixed;left:20px;bottom:20px;z-index:5;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(18px);max-width:270px}.hud b{font-family:Orbitron;font-size:11px;letter-spacing:.13em}.hud p{font-size:12px;color:var(--muted);margin:7px 0 0;line-height:1.5}.hint{position:fixed;bottom:22px;right:22px;z-index:5;color:#d7def3aa;font-size:12px;letter-spacing:.06em;text-align:right}
.modal{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#02040ab0;backdrop-filter:blur(12px)}.modal.show{display:flex}.panel{width:min(480px,100%);padding:22px;border-radius:24px;border:1px solid #c3d7ff33;background:linear-gradient(145deg,#161d2ee8,#080b15e8);box-shadow:0 24px 90px #0008}.panelhead{display:flex;justify-content:space-between;align-items:center}.panel h2{margin:8px 0 4px;font-family:Orbitron;letter-spacing:.04em}.sub{color:var(--muted);font-size:13px}.close{font-size:22px;border:0;background:transparent;color:white;cursor:pointer}.productvisual{height:150px;margin:16px 0;border-radius:18px;background:radial-gradient(circle at 50% 50%,#475777,#141b2b 70%);display:grid;place-items:center;font-size:62px}.price{font-size:23px;font-weight:700;color:var(--cyan);margin:14px 0}.sizes{display:flex;gap:8px;margin:12px 0}.sizes button{flex:1;background:#111a2a;color:white;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}.sizes button.selected{border-color:var(--cyan);box-shadow:0 0 14px #68e8ff2c}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#67e4ff,#8d7cff);color:#08101b;font-weight:700;cursor:pointer}.toast{position:fixed;z-index:20;top:78px;left:50%;transform:translateX(-50%);padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(20px);display:none}.toast.show{display:block}.cartpanel{position:fixed;z-index:8;right:20px;top:80px;width:min(330px,calc(100% - 40px));display:none;padding:16px;border-radius:18px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line)}.cartpanel.show{display:block}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff15;font-size:13px}.empty{color:var(--muted);font-size:13px}.editname{font-size:12px;color:var(--cyan);cursor:pointer;margin-left:8px}
@media(max-width:600px){.top{top:12px;left:12px;right:12px}.brand{font-size:16px}.glassbtn{padding:9px 12px;font-size:12px}.hud{left:12px;bottom:12px;max-width:210px}.hint{right:12px;bottom:12px;font-size:10px;max-width:120px}.brand small{font-size:8px}}
</style>
</head><body>
<div id="scene"></div>
<div class="top"><div class="brand"><span id="storeName">ADILVERSE</span><span class="editname" id="editName">✎ EDIT</span><small>VIRTUAL STREETWEAR SHOWROOM</small></div><div class="topright"><button class="glassbtn" id="cartBtn">CART <span id="cartCount">0</span></button><button class="glassbtn" id="resetView">RESET VIEW</button></div></div>
<div class="hud"><b>EXPLORE THE STORE</b><p>Drag to look around · Scroll to zoom · Tap glowing products to view details</p></div><div class="hint">3D SHOWROOM<br>TOUCH / MOUSE READY</div>
<div class="cartpanel" id="cartPanel"><div class="panelhead"><b>YOUR CART</b><button class="close" id="cartClose">×</button></div><div id="cartItems"></div><div id="cartTotal" style="padding-top:12px;font-weight:700"></div></div>
<div class="modal" id="productModal"><div class="panel"><div class="panelhead"><span class="sub">PRODUCT DETAIL</span><button class="close" id="modalClose">×</button></div><div class="productvisual" id="visual">👟</div><h2 id="pName">Product</h2><div class="sub" id="pDesc"></div><div class="price" id="pPrice"></div><div class="sub">SELECT SIZE</div><div class="sizes" id="sizes"></div><button class="primary" id="addCart">ADD TO CART</button></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const root=document.querySelector('#scene');const scene=new THREE.Scene();scene.background=new THREE.Color(0x070a12);scene.fog=new THREE.Fog(0x070a12,18,45);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.set(0,4.8,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.target.set(0,2.1,0);controls.minDistance=5;controls.maxDistance=20;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xb5c9ff,0x17101e,1.6));const key=new THREE.PointLight(0x69e7ff,45,30);key.position.set(-5,6,4);scene.add(key);const purple=new THREE.PointLight(0x8955ff,42,28);purple.position.set(5,5,-5);scene.add(purple);
const mat=(c,rough=.65,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});const floorMat=mat(0x111522,.35,.35);const wallMat=mat(0x161a27,.8);const floor=new THREE.Mesh(new THREE.PlaneGeometry(22,22),floorMat);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function wall(w,h,x,y,z,rot=0){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.18),wallMat);m.position.set(x,y,z);m.rotation.y=rot;m.receiveShadow=true;scene.add(m);return m}wall(22,8,0,4,-8);wall(22,8,0,4,8);wall(16,8,-11,4,0,Math.PI/2);wall(16,8,11,4,0,Math.PI/2);
// ceiling neon rails
function rail(x,z,len,color){let g=new THREE.Mesh(new THREE.BoxGeometry(.08,.07,len),new THREE.MeshBasicMaterial({color}));g.position.set(x,7.5,z);scene.add(g);let l=new THREE.PointLight(color,9,12);l.position.set(x,7.2,z);scene.add(l)}rail(-5,-2,9,0x68e8ff);rail(5,-2,9,0x9b74ff);rail(0,4,8,0x68e8ff);
// wall poster panels, decorative typography
function poster(x,y,z,rot,title,subtitle,color){let group=new THREE.Group();group.position.set(x,y,z);group.rotation.y=rot;let panel=new THREE.Mesh(new THREE.BoxGeometry(2.5,2.1,.06),mat(0x090d16,.45,.2));group.add(panel);let glow=new THREE.Mesh(new THREE.BoxGeometry(2.38,1.98,.025),new THREE.MeshBasicMaterial({color}));glow.position.z=.04;group.add(glow);let inner=new THREE.Mesh(new THREE.BoxGeometry(2.28,1.88,.03),mat(0x101727,.4,.2));inner.position.z=.07;group.add(inner);let canvas=document.createElement('canvas');canvas.width=512;canvas.height=384;let c=canvas.getContext('2d');c.fillStyle='#0b1020';c.fillRect(0,0,512,384);c.strokeStyle=color===0x68e8ff?'#68e8ff':'#9b74ff';c.lineWidth=5;c.strokeRect(16,16,480,352);c.fillStyle='#f6f8ff';c.font='bold 48px Arial';c.textAlign='center';c.fillText(title,256,166);c.fillStyle='#9fb3d9';c.font='24px Arial';c.fillText(subtitle,256,218);c.fillStyle=c.strokeStyle;c.font='bold 19px Arial';c.fillText('NIGHT DRIVE / STREET CULTURE',256,310);let tex=new THREE.CanvasTexture(canvas);let posterFace=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.8),new THREE.MeshBasicMaterial({map:tex}));posterFace.position.z=.1;group.add(posterFace);scene.add(group)}poster(-7,4,-7.85,0,'911 TURBO','PORSCHE • NIGHT RUN',0x68e8ff);poster(0,4,-7.85,0,'MONSTER','ENERGY / UNLEASH',0x9b74ff);poster(7,4,-7.85,0,'RED BULL','RACING • FLIGHT',0x68e8ff);poster(-10.85,4,-3,Math.PI/2,'STREET','FORM / FUNCTION',0x9b74ff);poster(10.85,4,3,-Math.PI/2,'AFTER DARK','URBAN COLLECTION',0x68e8ff);
// shelves and display plinths
function box(w,h,d,x,y,z,color){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,.45,.35));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}box(12,.2,1.1,0,1.1,-3.5,0x232a3c);box(12,.15,1.1,0,2.8,-3.5,0x252c40);box(12,.12,1.1,0,4.5,-3.5,0x252c40);
const products=[{name:'AERON RUNNER',price:7499,desc:'Lightweight everyday runner with layered mesh, sculpted sole and reflective accents.',emoji:'👟',color:0x68e8ff},{name:'NIGHTSHIFT JACKET',price:5999,desc:'Technical street jacket with utility pockets, contrast stitching and a soft inner lining.',emoji:'🧥',color:0x9b74ff},{name:'VECTOR HOODIE',price:3299,desc:'Heavyweight relaxed hoodie with clean graphics and a structured fit.',emoji:'👕',color:0x68e8ff},{name:'RUSH TRAINER',price:8299,desc:'Performance-inspired sneaker with responsive cushioning and a bold silhouette.',emoji:'👟',color:0xff477e},{name:'CORE TEE',price:1499,desc:'Premium cotton tee with a minimal front mark and relaxed cut.',emoji:'👕',color:0x9b74ff}];let clickable=[];
function productObject(p,i){let x=-4.8+i*2.4,z=-3.48,y=1.45+(i%2)*1.62;let group=new THREE.Group();group.position.set(x,y,z);let base=new THREE.Mesh(new THREE.BoxGeometry(1.25,.12,.78),mat(0x22283a,.3,.4));base.position.y=-.3;group.add(base);let body=new THREE.Mesh(new THREE.BoxGeometry(.8,.55,.42),mat(p.color,.3,.35));body.position.y=.12;body.rotation.z=-.1;group.add(body);let accent=new THREE.Mesh(new THREE.BoxGeometry(.9,.08,.46),new THREE.MeshBasicMaterial({color:p.color}));accent.position.y=-.17;group.add(accent);let light=new THREE.PointLight(p.color,2.8,4);light.position.y=.8;group.add(light);group.userData.product=p;scene.add(group);clickable.push(group);return group}products.forEach(productObject);
// front welcome sign
poster(0,3.4,7.82,Math.PI,'ADILVERSE','ENTER YOUR OWN WORLD',0x68e8ff);
const ray=new THREE.Raycaster();const mouse=new THREE.Vector2();let selected=null;renderer.domElement.addEventListener('pointerdown',e=>{const rect=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-rect.left)/rect.width*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(clickable,true);if(hits.length){let obj=hits[0].object;while(obj&&!obj.userData.product)obj=obj.parent;if(obj&&obj.userData.product)openProduct(obj.userData.product)}});
let chosenSize='M';function openProduct(p){selected=p;document.querySelector('#visual').textContent=p.emoji;document.querySelector('#pName').textContent=p.name;document.querySelector('#pDesc').textContent=p.desc;document.querySelector('#pPrice').textContent='₹ '+p.price.toLocaleString('en-IN');const sizes=p.emoji==='👟'?['6','7','8','9','10']:['S','M','L','XL'];document.querySelector('#sizes').innerHTML=sizes.map(s=>`<button class="${s===chosenSize?'selected':''}">${s}</button>`).join('');document.querySelectorAll('#sizes button').forEach(b=>b.onclick=()=>{chosenSize=b.textContent;document.querySelectorAll('#sizes button').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelector('#productModal').classList.add('show')}
document.querySelector('#modalClose').onclick=()=>document.querySelector('#productModal').classList.remove('show');document.querySelector('#productModal').onclick=e=>{if(e.target.id==='productModal')e.currentTarget.classList.remove('show')};let cart=[];function renderCart(){document.querySelector('#cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0);let el=document.querySelector('#cartItems');if(!cart.length){el.innerHTML='<p class="empty">Your cart is empty.</p>';document.querySelector('#cartTotal').textContent='';return}el.innerHTML=cart.map(it=>`<div class="cartrow"><span>${it.name} · ${it.size} × ${it.qty}</span><span>₹${(it.price*it.qty).toLocaleString('en-IN')}</span></div>`).join('');document.querySelector('#cartTotal').textContent='Total: ₹'+cart.reduce((s,i)=>s+i.price*i.qty,0).toLocaleString('en-IN')}
document.querySelector('#addCart').onclick=()=>{if(!selected)return;let item=cart.find(i=>i.name===selected.name&&i.size===chosenSize);if(item)item.qty++;else cart.push({name:selected.name,size:chosenSize,price:selected.price,qty:1});renderCart();document.querySelector('#productModal').classList.remove('show');toast(selected.name+' added to cart')};document.querySelector('#cartBtn').onclick=()=>document.querySelector('#cartPanel').classList.toggle('show');document.querySelector('#cartClose').onclick=()=>document.querySelector('#cartPanel').classList.remove('show');
function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}document.querySelector('#editName').onclick=()=>{let n=prompt('Enter your store name:',document.querySelector('#storeName').textContent);if(n&&n.trim()){document.querySelector('#storeName').textContent=n.trim();document.title=n.trim()+' — Virtual Store';toast('Store name updated')}};
document.querySelector('#resetView').onclick=()=>{camera.position.set(0,4.8,13);controls.target.set(0,2.1,0);controls.update()};renderCart();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
